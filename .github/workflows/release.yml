name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (for example v1.0.4)'
        required: true
        default: 'v1.0.3'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore complete source tree
        shell: powershell
        run: ./prepare_sources.ps1

      - name: Build embedded UI bundle
        shell: powershell
        run: ./prepare_ui.ps1

      - name: Publish QFact.WE2Video
        shell: powershell
        run: dotnet publish src/QFact.WE2Video/QFact.WE2Video.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=embedded -o release/win-x64

      - name: SHA-256
        shell: powershell
        run: |
          $h=(Get-FileHash -Algorithm SHA256 release/win-x64/QFact.WE2Video.exe).Hash.ToLower()
          Set-Content -Encoding ASCII release/SHA256SUMS.txt "$h  QFact.WE2Video.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: QFact.WE2Video-win-x64
          path: |
            release/win-x64/QFact.WE2Video.exe
            release/SHA256SUMS.txt

      - name: Resolve release tag
        id: release_tag
        shell: powershell
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            "tag=${{ inputs.tag }}" >> $env:GITHUB_OUTPUT
          } else {
            "tag=${{ github.ref_name }}" >> $env:GITHUB_OUTPUT
          }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: QFact.WE2Video ${{ steps.release_tag.outputs.tag }}
          body_path: RELEASE_NOTES.md
          files: |
            release/win-x64/QFact.WE2Video.exe
            release/SHA256SUMS.txt
          make_latest: true
